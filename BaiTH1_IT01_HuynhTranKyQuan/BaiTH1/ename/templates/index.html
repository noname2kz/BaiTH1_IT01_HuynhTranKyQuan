<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <title>TRANG WEB THUONG MAI</title>
</head>
<body>
<nav class="navbar navbar-expand-sm bg-light navbar-light">
    <div class="container-fluid">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link active" href="/">WELCOME TO TECHNOLOGY SHOP</a>
            </li>
            <li class="navbar-nav">
                {% for c in categories %}
                <a class="nav-link active" href="/?category_id={{ c.id }}"> {{ c.name }} </a>
                {% endfor %}
            </li>
            <li class="nav-item">
                <a class="nav-link text-success" href="/login">Dang nhap</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" href="/register">Dang ky</a>
            </li>
        </ul>
        <form method="get" action="/" class="d-flex">
            <input class="form-control me-2" type="text" placeholder="Nhap ten can tim kiem" name="kw">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>
</nav>
<section class="container-fluid">
    {% if products %}
    <div class="row">
        {% for p in products %}
        <div class="col-md-3 col-6 p-10">
            <div class="card">
                <img class="card-img-top" src="{{ p.image }}" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{ p.name }}</h4>
                    <p class="card-text">{{ p.price}}</p>
                    <a href="#" class="btn btn-primary">Xem Chi tiet</a>
                    <button class="btn btn-dangerous">Dat hang</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-warning mt-2">
        KHONG CO SAN PHAM NAO
    </div>
    {% endif %}
</section>
</body>
</html>
